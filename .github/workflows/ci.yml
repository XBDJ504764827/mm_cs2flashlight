name: Build and verify

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cs2-flashlight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run repository tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate metadata JSON
        run: python3 -m json.tool plugin-metadata.json >/dev/null

  build:
    name: Build plugin
    runs-on: ubuntu-24.04
    needs: checks
    outputs:
      release_version: ${{ steps.archive.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install AMBuild
        run: |
          git clone --depth 1 https://github.com/alliedmodders/ambuild.git "$RUNNER_TEMP/ambuild"
          python3 -m pip install --disable-pip-version-check --no-cache-dir "$RUNNER_TEMP/ambuild"
      - name: Initialize SDK submodules
        run: git submodule update --init --recursive
      - name: Configure and build
        run: |
          mkdir build
          cd build
          python3 ../configure.py \
            --enable-optimize \
            --targets=x86_64
          ambuild
      - name: Verify installation package layout
        run: |
          test -f build/package/cs2/addons/metamod/cs2_flashlight.vdf
          test -f build/package/cs2/addons/cs2_flashlight/bin/linuxsteamrt64/cs2_flashlight.so
          test -f build/package/cs2/addons/cs2_flashlight/gamedata/cs2_flashlight.games.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cs2-flashlight-package
          path: build/package
          if-no-files-found: error

      - name: Create installation archive
        id: archive
        shell: bash
        run: |
          release_version="$(python3 -c 'import json; import re; value=json.load(open("plugin-metadata.json", encoding="utf-8"))["version"]; print(re.sub(r"\.\{\{git-[^}]+\}\}$", "", value))')"
          archive_name="cs2-flashlight-${release_version}-linux-x86_64.zip"
          mkdir -p release
          ARCHIVE_NAME="$archive_name" python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          package_root = Path("build/package/cs2")
          archive_path = Path("release") / os.environ["ARCHIVE_NAME"]
          with ZipFile(archive_path, "w", ZIP_DEFLATED) as archive:
              for path in (package_root / "addons").rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(package_root).as_posix())
          PY
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload installation archive
        uses: actions/upload-artifact@v4
        with:
          name: cs2-flashlight-release
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download installation archive
        uses: actions/download-artifact@v4
        with:
          name: cs2-flashlight-release
          path: release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.release_version }}
          name: CS2 Flashlight v${{ needs.build.outputs.release_version }}
          generate_release_notes: true
          files: release/*.zip

  bump-version:
    name: Bump version after main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Increment patch version
        run: python3 scripts/bump_version.py
      - name: Commit version update
        run: |
          if git diff --quiet -- plugin-metadata.json; then
            echo "Version is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-metadata.json
          git commit -m "chore: bump plugin version [skip ci]"
          git push
